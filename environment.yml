# Full app (Kokoro + Chatterbox). Chatterbox needs spaCy/blis — use Python 3.11, not 3.14.
#
#   conda env create -f environment.yml
#   conda activate tts_app
#
# The pip list is in requirements.txt (same folder as this file).

name: tts_app
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.*
  - pip>=24
  - setuptools
  - wheel
  - pip:
      - -r requirements.txt
